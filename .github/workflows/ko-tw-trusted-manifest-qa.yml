name: KO TW trusted live manifest offline QA
on:
  pull_request:
    paths:
      - 'tools/private_live_ko_tw_trusted_manifest.py'
      - 'tests/test_private_live_ko_tw_trusted_manifest.py'
      - '.github/workflows/ko-tw-trusted-manifest-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance-regressions:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile provenance and adapter
        run: python -m py_compile tools/private_live_ko_tw_trusted_manifest.py tools/private_live_ko_tw_snapshot_adapter.py
      - name: Run fail-closed provenance regressions
        run: python -m unittest discover -s tests -p test_private_live_ko_tw_trusted_manifest.py -v
