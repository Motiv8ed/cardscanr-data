name: Private official TH-ID source evidence gate

on:
  pull_request:
    paths:
      - "tools/private_official_source_evidence_gate.py"
      - "tests/test_private_official_source_evidence_gate.py"
      - ".github/workflows/private-official-source-evidence-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-official-source-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline evidence-gate regression tests
        run: python -m unittest discover -s tests -p test_private_official_source_evidence_gate.py -v
