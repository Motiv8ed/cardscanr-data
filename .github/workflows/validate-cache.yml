name: Validate Cache

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Validate cache
        run: CARDSCANR_VALIDATE_QUIET=1 python tools/validate_cache.py

      - name: EN/JA image independence catalogue CDN regression
        run: python -m pytest tests/test_en_jp_image_independence_regression.py -q --tb=line
