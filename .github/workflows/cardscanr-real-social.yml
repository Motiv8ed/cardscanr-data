name: Build authentic CardScanR social images
on:
  push:
    branches: [main]
    paths:
      - scripts/generate_real_social_frames.py
      - .github/workflows/cardscanr-real-social.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate images from real public screenshots only
        run: python scripts/generate_real_social_frames.py
      - name: Publish generated PNGs and provenance
        run: |
          git config user.name "CardScanR social assets bot"
          git config user.email "cardscanr-social-assets@users.noreply.github.com"
          git add social/2026-11-15/derived/
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Generate real CardScanR screenshot story/feed frames"
            git push
          fi
