name: Build authentic CardScanR social images
# Writes to main (git push). Manual only, typed confirmation, protected environment.
# Was: push to main (paths) with contents: write, i.e. unattended writes.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH to commit regenerated social PNGs to main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cardscanr-data-writer-main
  cancel-in-progress: false
jobs:
  build:
    if: inputs.confirm == 'PUBLISH'
    # Create this environment in repo settings with Andy as required reviewer.
    environment: social-publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate images from real public screenshots only
        run: python scripts/generate_real_social_frames.py
      - name: Publish generated PNGs and provenance
        run: |
          git config user.name "CardScanR social assets bot"
          git config user.email "cardscanr-social-assets@users.noreply.github.com"
          git add social/2026-11-15/derived/
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Generate real CardScanR screenshot story/feed frames"
            git push
          fi
