name: One-time AU owner-reviewed recovery offline QA
on:
  push:
    branches: [atlas/owner-reviewed-au-pricing-recovery-20261123]
    paths: [.github/workflows/owner-reviewed-recovery-once.yml]
permissions:
  contents: read
jobs:
  recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    env:
      EBAY_BROWSER_ENABLED: "false"
      OWNED_DAILY_FULL_ENABLE: "false"
      CONFIRM_LIVE_EBAY_WORKER: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q tools/owner_reviewed_au_pricing_recovery.py tests/test_owner_reviewed_au_pricing_recovery.py
      - run: python -m unittest discover -s tests -p 'test_owner_reviewed_au_pricing_recovery.py' -v
      - run: python -m unittest discover -s tests -p 'test_control_plane_incidents.py' -v
      - run: python -m unittest discover -s tests -p 'test_control_plane_reconciliation.py' -v
