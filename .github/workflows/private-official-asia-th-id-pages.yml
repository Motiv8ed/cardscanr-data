name: Private official Thai Indonesian next-page artwork source batch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-official-asia-th-id-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-asia-th-id-page-sweep
  cancel-in-progress: false
jobs:
  source-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        page: [2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixed parser dependencies
        run: |
          python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.14.2'
      - name: Guarded official URL source-only tests
        run: |
          python -m py_compile tools/private_official_asia_th_id_url_pilot.py
          PYTHONPATH=. python tools/private_official_asia_th_id_url_pilot.py --self-test
      - name: Read up to 40 official HTML card details per page
        env:
          CARD_PAGE: ${{ matrix.page }}
        run: |
          PYTHONPATH=. python tools/private_official_asia_th_id_url_pilot.py \
            --out "private-official-asia-page-$CARD_PAGE" --limit 20 --page "$CARD_PAGE"
      - name: Verify exact page, SHA and zero image downloads or live writes
        env:
          CARD_PAGE: ${{ matrix.page }}
        run: |
          python - <<'PY'
          import os,hashlib,json
          from pathlib import Path
          page=int(os.environ['CARD_PAGE'])
          root=Path(f"private-official-asia-page-{page}")
          r=json.loads((root/'receipt.json').read_text(encoding='utf8'))
          assert r['classification']=='PRIVATE_OFFICIAL_ASIA_CARD_URL_RESEARCH_ONLY'
          assert r['source_cards']==40 and r['source_list_page']==page
          assert r['source_request_budget']==42 and r['image_url_references']==40
          assert len(r['sources'])==2
          assert {x['locale'] for x in r['sources']}=={'th','id'}
          assert all(x['source_list_page']==page for x in r['sources'])
          assert r['live_vault_writes']==r['image_binaries_downloaded']==0
          assert r['verified_new_canonical_cards']==r['exact_live_canonical_ids_verified']==0
          assert not r['artwork_rights_granted'] and not r['public_artwork_enabled']
          raw=(root/'official_asia_card_source_urls.jsonl').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==r['source_url_manifest_sha256']
          data=[json.loads(x) for x in raw.splitlines()]
          assert len(data)==40
          assert all(x['source_list_page']==page and x['source_image_url_reference'] and
                     not x['artwork_rights_cleared'] and not x['exact_vault_match_proven']
                     for x in data)
          print('OFFICIAL_ASIA_PAGED_URL_SOURCE_PASS',json.dumps({
            'page':page,'source_image_urls':len(data),'live_changes':0},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CardScanR-Official-TH-ID-Page-${{ matrix.page }}
          path: private-official-asia-page-${{ matrix.page }}/
          retention-days: 14
          if-no-files-found: error
