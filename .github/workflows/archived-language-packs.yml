name: Archived Multilingual Catalogue Pack Inventory
on:
  pull_request:
    paths:
      - 'tools/audit_archived_language_packs.py'
      - 'tests/test_archived_language_pack_inventory.py'
      - 'tools/preflight_legacy_korean_pack.py'
      - 'tests/test_preflight_legacy_korean_pack.py'
      - '.github/workflows/archived-language-packs.yml'
  push:
    branches:
      - 'catalogue/archived-multilingual-pack-inventory-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and network-free safety tests
        run: |
          python -m py_compile tools/audit_archived_language_packs.py tools/preflight_legacy_korean_pack.py
          PYTHONPATH=. python -m unittest discover -s tests -p test_preflight_legacy_korean_pack.py -v
          PYTHONPATH=. python -m unittest discover -s tests -p test_archived_language_pack_inventory.py -v
  live-archive:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch only known public archived JSON manifests and HEAD pack links
        continue-on-error: true
        run: |
          python tools/audit_archived_language_packs.py --output "$RUNNER_TEMP/archive-audit"
      - name: Keep read-only inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CardScanR-Archived-Language-Pack-Inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/archive-audit/
          if-no-files-found: warn
          retention-days: 7

  ko-structural-preflight:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify only public canary Korean and active core pack SHA/SQLite bytes
        continue-on-error: true
        run: |
          python tools/preflight_legacy_korean_pack.py --output "$RUNNER_TEMP/ko-structural-preflight"
      - name: Save private metadata-only structural compatibility receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CardScanR-Korean-Structural-Preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/ko-structural-preflight/
          if-no-files-found: warn
          retention-days: 7
