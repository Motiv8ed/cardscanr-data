name: Private official Indonesian SV4a source URL pages 17-20
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-official-id-sv4a-pages-17-20.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-official-id-sv4a-throttled
  cancel-in-progress: false
jobs:
  bounded-html-source-research:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        page: [17,18,19,20]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Official HTML parser dependencies
        run: |
          python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.14.2'
      - name: Strict official source host and page tests
        run: |
          python -m py_compile tools/private_official_indonesian_sv4a_next_urls.py
          PYTHONPATH=. python tools/private_official_indonesian_sv4a_next_urls.py --self-test
      - name: Read maximum one list page plus twenty card-details (HTML only)
        env:
          PAGE_INDEX: ${{ matrix.page }}
        run: |
          PYTHONPATH=. python tools/private_official_indonesian_sv4a_next_urls.py \
            --out "official-id-$PAGE_INDEX" --limit 20 --page "$PAGE_INDEX"
      - name: Assert SHA provenance and prohibit image binaries and live edits
        env:
          PAGE_INDEX: ${{ matrix.page }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          page=int(os.environ['PAGE_INDEX'])
          folder=Path(f"official-id-{page}")
          r=json.loads((folder/'receipt.json').read_text('utf8'))
          assert r['classification']=='PRIVATE_OFFICIAL_ID_SV4A_NEXT_PAGE_RESEARCH_ONLY'
          assert r['source_list_page']==page
          assert 1<=r['source_cards']<=20
          assert r['image_url_references']==r['source_cards']
          assert r['source_request_budget']==21
          assert len(r['sources'])==1
          assert r['sources'][0]['locale']=='id' and r['sources'][0]['set']=='SV4a'
          assert r['image_binaries_downloaded']==r['live_vault_writes']==0
          assert r['verified_new_canonical_cards']==r['exact_live_canonical_ids_verified']==0
          assert not r['artwork_rights_granted'] and not r['public_artwork_enabled']
          raw=(folder/'official_asia_card_source_urls.jsonl').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==r['source_url_manifest_sha256']
          rows=[json.loads(x) for x in raw.splitlines()]
          assert len(rows)==r['source_cards']
          assert all(x['source_list_page']==page and x['language']=='id'
                     and x['source_product_code']=='SV4a'
                     and not x['exact_vault_match_proven'] and not x['image_downloaded']
                     and not x['artwork_rights_cleared'] for x in rows)
          print('OFFICIAL_ID_SV4A_NEXT_SOURCE_PAGE_PASS',json.dumps({
            'page':page,'source_card_details':len(rows),
            'image_url_refs':r['image_url_references'],
            'artwork_files':0,'live_card_changes':0},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CardScanR-Official-ID-SV4a-Page-${{ matrix.page }}
          path: official-id-${{ matrix.page }}/
          retention-days: 14
          if-no-files-found: error
