name: Private exact TH ID official image references versus archived CardScanR packs

on:
  push:
    branches: [main]
    paths:
      - 'tools/private_official_asia_th_id_exact_crosswalk.py'
      - '.github/workflows/private-official-asia-th-id-exact-crosswalk.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-official-asia-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline source identity comparisons before network requests
        run: |
          python -m py_compile tools/private_official_asia_th_id_exact_crosswalk.py
          PYTHONPATH=. python tools/private_official_asia_th_id_exact_crosswalk.py --self-test
      - uses: actions/download-artifact@v4
        with:
          repository: Motiv8ed/cardscanr-data
          run-id: 44712180657
          name: CardScanR-Official-TH-ID-Pilot-Research
          github-token: ${{ github.token }}
          path: verified-official-source
      - name: Crosswalk two SHA-verified CardScanR language packs read-only
        run: |
          PYTHONPATH=. python tools/private_official_asia_th_id_exact_crosswalk.py \
            --pilot verified-official-source --out private-official-crosswalk
      - name: Verify strict no-modification identity and provenance
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('private-official-crosswalk')
          r=json.loads((root/'receipt.json').read_text(encoding='utf8'))
          assert r['classification']=='OFFICIAL_TH_ID_ARCHIVED_EXACT_SOURCE_IMAGE_CROSSWALK_ONLY'
          assert r['source_card_rows']==10
          assert len(r['archive_sha256_by_locale'])==2
          assert r['exact_candidate_records']<=r['exact_crosswalk_rows']<=10
          assert r['artwork_binaries_downloaded']==r['live_vault_writes']==r['new_canonical_cards']==0
          assert r['verified_live_id_and_image_missing']==0
          assert not r['artwork_rights_verified'] and not r['safe_for_publication']
          data=(root/'archived_exact_crosswalk.jsonl').read_bytes()
          assert hashlib.sha256(data).hexdigest()==r['crosswalk_sha256']
          rows=[json.loads(x) for x in data.splitlines()]
          assert len(rows)==r['exact_crosswalk_rows']
          assert all(not x['artwork_rights_verified'] and not x['actual_live_vault_id_verified'] for x in rows)
          print('OFFICIAL_TH_ID_CROSSWALK_VERIFIED',json.dumps({
            'matched':len(rows),'candidate_missing_archive_image':r['exact_candidate_records'],
            'reasons':r['matching_results'],'writes':0},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CardScanR-TH-ID-Archived-Exact-Image-Sources
          path: private-official-crosswalk/
          retention-days: 14
          if-no-files-found: error
