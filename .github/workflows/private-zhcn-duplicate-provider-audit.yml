name: CardScanR archived Chinese provider duplicate identity audit

on:
  push:
    branches: [main]
    paths:
      - 'tools/private_zhcn_cross_provider_duplicates.py'
      - '.github/workflows/private-zhcn-duplicate-provider-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-identity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source-only duplicate identity unit checks
        run: |
          python -m py_compile tools/private_zhcn_cross_provider_duplicates.py
          PYTHONPATH=. python tools/private_zhcn_cross_provider_duplicates.py --self-test
      - name: Verify live public artifact SHA256 and audit provider source aliases
        run: |
          PYTHONPATH=. python tools/private_zhcn_cross_provider_duplicates.py --output private-zhcn-provider-review
      - name: Refuse canonical identity merging or any production writes
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('private-zhcn-provider-review/receipt.json').read_text(encoding='utf8'))
          assert d['classification']=='READ_ONLY_ZHCN_CROSS_PROVIDER_ALIAS_CANDIDATES'
          assert d['archived_pack_card_records']==41185
          assert d['canonical_id_uniqueness_verified']
          assert len(d['source_pack_sha256'])==64
          assert d['new_canonical_cards']==d['canonical_ids_changed']==0
          assert d['vault_writes']==d['production_writes']==d['image_binaries_downloaded']==0
          assert d['duplicate_group_is_not_a_safe_merge']
          assert not d['safe_to_merge_duplicates']
          assert d['archive_only'] and not d['artwork_rights_verified']
          print('CHINESE_ALIAS_IDENTITY_REVIEW_PASS',json.dumps({
            'archived_rows':d['archived_pack_card_records'],
            'distinct_identity_groups':d['distinct_exact_name_set_number_groups'],
            'candidate_alias_groups':d['cross_provider_candidate_alias_groups'],
            'candidate_alias_rows':d['cross_provider_candidate_alias_rows'],
            'no_changes':True},sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as f:
              f.write('### Chinese archived pack possible duplicate source IDs\n\n')
              f.write(f"Archived records: **{d['archived_pack_card_records']:,}**\n\n")
              f.write(f"Cross-provider candidate alias groups: **{d['cross_provider_candidate_alias_groups']:,}**\n\n")
              f.write('No canonical identity deletions or merges; variant differences require independent proof.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CardScanR-Archived-ZHCN-CrossProvider-Identity-Audit
          path: private-zhcn-provider-review/receipt.json
          retention-days: 14
          if-no-files-found: error
