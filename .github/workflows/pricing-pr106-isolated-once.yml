name: Pricing PR106 isolated offline regression (single branch)

on:
  push:
    branches:
      - fix/staged-ebay-transient-resume-20261122
    paths:
      - .github/workflows/pricing-pr106-isolated-once.yml

permissions:
  contents: read

concurrency:
  group: pricing-pr106-isolated-once
  cancel-in-progress: true

jobs:
  staged-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MARKET_LOOKUP_PROVIDER: mock
      CONFIRM_LIVE_EBAY_WORKER: "false"
      EBAY_BROWSER_ENABLED: "false"
      EBAY_BROWSER_KILL_SWITCH: "true"
      OWNED_DAILY_FULL_ENABLE: "false"
      EBAY_SCALE_SET_SWEEP_LIVE: "false"
    steps:
      - name: Check out exact PR source
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate source syntax
        run: python -m compileall -q workers/market_price_worker.py cardscanr_market_engine/continuous_worker_policy.py tests/test_staged_ebay_transient_resume_20261122.py
      - name: Staged halt recovery regression
        run: python -m unittest discover -s tests -p 'test_staged_ebay_transient_resume_20261122.py' -v
      - name: Nearby halt and rate-safety regression
        run: |
          python -m unittest discover -s tests -p 'test_continuous_au_resume.py' -v
          python -m unittest discover -s tests -p 'test_continuous_safety_transient_hardening.py' -v
          python -m unittest discover -s tests -p 'test_pricing_outage_33_gated_heartbeat.py' -v
          python -m unittest discover -s tests -p 'test_ebay_availability_circuit.py' -v
